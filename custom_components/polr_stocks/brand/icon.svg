<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    PoLR Stocks brand icon.

    Full-bleed circle in a saturated mid-tone, matching the house style set by
    polr_tmdb. Saturated rather than dark on purpose: Home Assistant renders
    integration icons on both light and dark cards, and a deep "finance
    terminal" navy would sink into a dark theme.

    Motif is a rising trend line over candlesticks — legible down to ~24px,
    which is the size this is actually shown at in Devices & Services.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0F9D58"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>

  <!--
    Candlesticks, held well back so the trend line stays the subject. Three,
    not four: a fourth sat under the arrowhead and turned the top-right corner
    to mush at small sizes. Kept clear of the arrow entirely.
  -->
  <g fill="#FFFFFF" opacity="0.24">
    <rect x="56"  y="152" width="26" height="50" rx="9"/>
    <rect x="105" y="130" width="26" height="72" rx="9"/>
    <rect x="154" y="152" width="26" height="50" rx="9"/>
  </g>

  <!-- Rising trend line. Heavier than looks right at 256px, so that it still
       reads as one continuous stroke when scaled to 24px. -->
  <polyline points="50,154 98,112 136,134 196,70"
            fill="none" stroke="#FFFFFF" stroke-width="20"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrowhead, closing the line at the top right. -->
  <polyline points="154,64 202,64 202,112"
            fill="none" stroke="#FFFFFF" stroke-width="20"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
